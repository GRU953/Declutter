#
# Builds an installable APK on every push, so getting Declutter onto a phone needs no
# computer and no Android Studio: open the run, download the artefact, tap it.

name: android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle caches the Gradle user home and validates the wrapper JAR, so no
      # separate cache or wrapper-validation step is wanted here -- two caching mechanisms
      # over the same directory fight each other.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The release build falls back to Android's debug key when no release keystore is
      # configured. Keeping that key in the cache means successive builds share one
      # signature, so an update installs over the previous one instead of being rejected.
      - name: Reuse one signing key across builds
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: declutter-fallback-signing-key-v1

      - name: Check the catalogue against the blocklist
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build the APK
        env:
          DECLUTTER_KEYSTORE_PATH: ${{ secrets.DECLUTTER_KEYSTORE_PATH }}
          DECLUTTER_KEYSTORE_PASSWORD: ${{ secrets.DECLUTTER_KEYSTORE_PASSWORD }}
          DECLUTTER_KEY_ALIAS: ${{ secrets.DECLUTTER_KEY_ALIAS }}
          DECLUTTER_KEY_PASSWORD: ${{ secrets.DECLUTTER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK after the build
        id: apk
        run: |
          set -euo pipefail
          src=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$src"
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          name="declutter-${version}-${GITHUB_SHA::7}.apk"
          mkdir -p dist
          cp "$src" "dist/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: declutter-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    # A tagged commit also gets a Release, so a download link can be shared without
    # sending anybody into the Actions tab.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the APK built above
        uses: actions/download-artifact@v7
        with:
          name: declutter-apk
          path: dist

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.apk \
            --title "Declutter ${GITHUB_REF_NAME}" \
            --notes "Install by opening the .apk on the phone. Android will ask once whether to allow installing from this source." \
            --verify-tag || gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber
